# set `baseurl` to your root domain
# if you set it to "/" share icons won't work properly on production
baseurl = "https://blog.gerritjanfaber.nl/"  # Include trailing slash
title = "The wireless lair"  # Edit directly from config/_default/languages.toml # alternatively, uncomment this and remove `title` entry from the aforemention file.
copyright = "Gerrit Jan"
# canonifyurls = true
enableRobotsTXT = true

#theme = "hugo-clarity"
theme = ["github.com/chipzoller/hugo-clarity"]
disqusShortname = ""

DefaultContentLanguage = "en"
# [languages]
# config/_default/languages.toml

# [menus]
# config/_default/menus/menu.xx.toml

[taxonomies]
 category = "categories"
 tag = "tags"
 series = "series"

[permalinks]
 post = "/:year/:month/:slug"

[outputs]
 home = ["HTML", "RSS", "JSON"]

[pagination]
 pagerSize = 10

[sitemap]
#   changefreq = 'daily'
  priority = 1
